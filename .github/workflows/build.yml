name: Build Zmeyka iOS 6 ARMv7 IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native ARMv7 IPA
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool git \
            clang llvm libssl-dev zlib1g-dev uuid-dev \
            fakeroot zip unzip curl

      - name: Build apple-libtapi
        run: |
          git clone --depth 1 https://github.com/tpoechtrager/apple-libtapi.git
          cd apple-libtapi
          export INSTALLPREFIX=/opt/cctools
          sudo mkdir -p /opt/cctools
          sudo chown -R $USER:$USER /opt/cctools
          ./build.sh
          ./install.sh
          cd ..

      - name: Build cctools-port for arm-apple-darwin11 (ARMv7)
        run: |
          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git
          cd cctools-port/cctools
          
          # Fix modern Linux libdispatch issues in ld64 libcodedirectory
          sed -i 's/DISPATCH_QUEUE_SERIAL/NULL/g' ld64/src/ld/libcodedirectory.c || true
          sed -i 's/DISPATCH_APPLY_AUTO/0/g' ld64/src/ld/libcodedirectory.c || true
          sed -i 's/#define LIBCD_PARALLEL 1/#define LIBCD_PARALLEL 0/g' ld64/src/ld/libcodedirectory.c || true
          
          ./configure \
            --prefix=/opt/cctools \
            --target=arm-apple-darwin11 \
            --with-libtapi=/opt/cctools \
            CFLAGS="-O2 -Wno-error" \
            CXXFLAGS="-O2 -Wno-error"
          make -j$(nproc)
          make install
          cd ../..
          echo "/opt/cctools/bin" >> $GITHUB_PATH

      - name: Install ldid (Code Signing Tool)
        run: |
          git clone --depth 1 https://github.com/tpoechtrager/ldid.git
          cd ldid
          make INSTALLPREFIX=/opt/cctools install
          cd ..

      - name: Download iPhoneOS 6.1 SDK
        run: |
          mkdir -p sdks
          git clone --depth 1 https://github.com/qianjigui/iOS-sdks.git sdks-repo
          mv sdks-repo/iPhoneOS6.1.sdk sdks/
          rm -rf sdks-repo
          echo "SDK successfully verified:"
          ls -la sdks/iPhoneOS6.1.sdk

      - name: Compile and Link Zmeyka Mach-O Executable (ARMv7)
        run: |
          export PATH=/opt/cctools/bin:$PATH
          SDK_ROOT=$PWD/sdks/iPhoneOS6.1.sdk
          
          # Target flags strictly for iPhone 4S (ARMv7, iOS 6.0+)
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/main.m -o main.o
          
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/AppDelegate.m -o AppDelegate.o
            
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/MenuViewController.m -o MenuViewController.o
            
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/GameViewController.m -o GameViewController.o
            
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/SnakeGameEngine.m -o SnakeGameEngine.o
            
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/SnakeGridView.m -o SnakeGridView.o
            
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/SkeuomorphicButton.m -o SkeuomorphicButton.o
            
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -I./Zmeyka/Source \
            -c Zmeyka/Source/SoundManager.m -o SoundManager.o

          # Link all object files into native ARMv7 Mach-O executable
          clang -target arm-apple-darwin11 \
            -arch armv7 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework AudioToolbox \
            main.o AppDelegate.o MenuViewController.o GameViewController.o \
            SnakeGameEngine.o SnakeGridView.o SkeuomorphicButton.o SoundManager.o \
            -o Zmeyka_bin

          echo "Checking Mach-O binary type:"
          file Zmeyka_bin

      - name: Sign Binary and Bundle .app
        run: |
          export PATH=/opt/cctools/bin:$PATH
          
          # Create .app directory
          mkdir -p build/Payload/Zmeyka.app
          
          # Copy compiled Mach-O binary
          cp Zmeyka_bin build/Payload/Zmeyka.app/Zmeyka
          chmod +x build/Payload/Zmeyka.app/Zmeyka
          
          # Copy Info.plist and resources
          cp Zmeyka/Info.plist build/Payload/Zmeyka.app/Info.plist
          cp -r Zmeyka/Resources/* build/Payload/Zmeyka.app/
          cp -r Zmeyka/Icons/* build/Payload/Zmeyka.app/
          
          # Copy iTunesArtwork
          cp Zmeyka/Icons/iTunesArtwork build/Payload/iTunesArtwork || true
          
          # Ad-hoc sign executable and app bundle using ldid with entitlements
          ldid -SZmeyka/entitlements.plist build/Payload/Zmeyka.app/Zmeyka
          ldid -SZmeyka/entitlements.plist build/Payload/Zmeyka.app
          
          # Create .ipa archive
          cd build
          zip -r9 ../Zmeyka.ipa Payload
          cd ..
          
          echo "Finished packaging Zmeyka.ipa:"
          ls -la Zmeyka.ipa
          unzip -l Zmeyka.ipa

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zmeyka-iOS6-ARMv7
          path: Zmeyka.ipa
