name: Build Zmeyka iOS 6 ARMv7 IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native ARMv7 IPA
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 14 (supports armv7)
        run: |
          sudo xcode-select -s /Applications/Xcode_14.3.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_14.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_14.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_14.0.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_14.0.app/Contents/Developer
          xcodebuild -version
          xcode-select -p
          clang --version

      - name: Verify ARMv7 support
        run: |
          # Check that clang supports armv7-apple-ios
          echo "int main(){return 0;}" > /tmp/test.c
          clang -arch armv7 -target armv7-apple-ios6.0 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -o /tmp/test_bin /tmp/test.c 2>&1 || echo "Direct clang test done"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile Zmeyka Source Files (ARMv7)
        run: |
          SDK_ROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_ROOT"

          CLANG=$(xcrun --sdk iphoneos --find clang)
          echo "Using clang: $CLANG"

          CFLAGS="-arch armv7 \
            -target armv7-apple-ios6.0 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -O2 \
            -Wno-deprecated-declarations \
            -Wno-objc-property-no-attribute \
            -I./Zmeyka/Source"

          mkdir -p build_obj

          $CLANG $CFLAGS -c Zmeyka/Source/main.m              -o build_obj/main.o
          $CLANG $CFLAGS -c Zmeyka/Source/AppDelegate.m       -o build_obj/AppDelegate.o
          $CLANG $CFLAGS -c Zmeyka/Source/MenuViewController.m -o build_obj/MenuViewController.o
          $CLANG $CFLAGS -c Zmeyka/Source/GameViewController.m -o build_obj/GameViewController.o
          $CLANG $CFLAGS -c Zmeyka/Source/SnakeGameEngine.m    -o build_obj/SnakeGameEngine.o
          $CLANG $CFLAGS -c Zmeyka/Source/SnakeGridView.m      -o build_obj/SnakeGridView.o
          $CLANG $CFLAGS -c Zmeyka/Source/SkeuomorphicButton.m -o build_obj/SkeuomorphicButton.o
          $CLANG $CFLAGS -c Zmeyka/Source/SoundManager.m       -o build_obj/SoundManager.o

          echo "Object files:"
          ls -la build_obj/

      - name: Link Zmeyka Mach-O Executable
        run: |
          SDK_ROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang)

          $CLANG \
            -arch armv7 \
            -target armv7-apple-ios6.0 \
            -isysroot $SDK_ROOT \
            -miphoneos-version-min=6.0 \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework AudioToolbox \
            build_obj/main.o \
            build_obj/AppDelegate.o \
            build_obj/MenuViewController.o \
            build_obj/GameViewController.o \
            build_obj/SnakeGameEngine.o \
            build_obj/SnakeGridView.o \
            build_obj/SkeuomorphicButton.o \
            build_obj/SoundManager.o \
            -o Zmeyka_bin

          echo "Binary info:"
          file Zmeyka_bin
          lipo -info Zmeyka_bin

      - name: Bundle .app and Sign
        run: |
          mkdir -p build/Payload/Zmeyka.app

          # Copy binary
          cp Zmeyka_bin build/Payload/Zmeyka.app/Zmeyka
          chmod +x build/Payload/Zmeyka.app/Zmeyka

          # Copy Info.plist
          cp Zmeyka/Info.plist build/Payload/Zmeyka.app/Info.plist

          # Copy resources and icons
          cp -r Zmeyka/Resources/* build/Payload/Zmeyka.app/ 2>/dev/null || true
          cp -r Zmeyka/Icons/* build/Payload/Zmeyka.app/ 2>/dev/null || true

          # iTunesArtwork (must be at Payload level)
          cp Zmeyka/Icons/iTunesArtwork build/Payload/iTunesArtwork 2>/dev/null || true

          echo "App bundle contents:"
          ls -la build/Payload/Zmeyka.app/

          # Ad-hoc code signing with Apple's codesign
          codesign --force --sign - --entitlements Zmeyka/entitlements.plist \
            --timestamp=none \
            build/Payload/Zmeyka.app/Zmeyka

          echo "Binary signed successfully"

      - name: Package IPA
        run: |
          cd build
          zip -r9 ../Zmeyka.ipa Payload
          cd ..

          echo "IPA created:"
          ls -la Zmeyka.ipa
          echo "IPA contents:"
          unzip -l Zmeyka.ipa

          # Verify the binary inside
          unzip -p Zmeyka.ipa Payload/Zmeyka.app/Zmeyka > /tmp/inner_bin
          file /tmp/inner_bin
          lipo -info /tmp/inner_bin
          echo "Magic bytes (should be CE FA ED FE for ARMv7):"
          xxd /tmp/inner_bin | head -2

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zmeyka-iOS6-ARMv7
          path: Zmeyka.ipa
          retention-days: 30
